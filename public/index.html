<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blackjack</title>
  <meta name="description" content="Play Blackjack in your browser, dealt from a real 6-deck shoe by the Deck of Cards API.">
  <meta name="theme-color" content="#0b5d3b">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://deckofcardsapi.com">
  <link rel="stylesheet" href="css/styles.css">
  <script src="vendor/supabase-2.119.0.js"></script>
  <script type="module" src="js/auth.js"></script>
</head>
<body>
  <main id="login" class="login">
    <div class="login-card">
      <div class="login-suits" aria-hidden="true">♠ ♥ ♣ ♦</div>
      <h1>Blackjack</h1>
      <p class="login-sub">Sign in to take a seat at the table. Your chips are saved to your account in this browser.</p>
      <button id="btn-google" class="btn-google" type="button">
        <svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        <span>Sign in with Google</span>
      </button>
      <p id="login-error" class="login-error" role="alert" hidden></p>
    </div>
  </main>

  <main id="table" class="table" hidden>
    <header class="topbar">
      <h1>Blackjack</h1>
      <div class="user" aria-label="Signed-in player">
        <img id="user-avatar" class="avatar" width="40" height="40" alt="" referrerpolicy="no-referrer" hidden>
        <span id="user-initials" class="avatar initials" aria-hidden="true" hidden></span>
        <div class="user-text">
          <span id="user-greeting" class="greeting"></span>
          <span id="user-email" class="email"></span>
        </div>
        <button id="btn-signout" class="btn-link" type="button">Sign out</button>
      </div>
      <dl class="stats">
        <div><dt>Bankroll</dt><dd id="bankroll">$0</dd></div>
        <div><dt>Bet</dt><dd id="bet">$0</dd></div>
      </dl>
    </header>

    <nav class="tabs" role="tablist" aria-label="Sections">
      <button id="tab-table" class="tab" role="tab" aria-controls="panel-table" aria-selected="true" type="button">Table</button>
      <button id="tab-profile" class="tab" role="tab" aria-controls="panel-profile" aria-selected="false" type="button" tabindex="-1">
        Profile <span id="profile-badge" class="badge" hidden>New</span>
      </button>
    </nav>

    <div id="panel-table" class="panel game" role="tabpanel" aria-labelledby="tab-table">
    <section class="hand dealer" aria-labelledby="dealer-label">
      <h2 id="dealer-label">Dealer <span class="total" id="dealer-total"></span></h2>
      <div class="cards" id="dealer-cards"></div>
    </section>

    <div class="felt-line">
      <p class="rules">Blackjack pays 3 to 2 · Dealer stands on all 17s</p>
      <p class="status" id="status" role="status" aria-live="polite">Loading…</p>
    </div>

    <section class="hand player" aria-labelledby="player-label">
      <h2 id="player-label"><span id="player-name">You</span> <span class="total" id="player-total"></span></h2>
      <div class="cards" id="player-cards"></div>
    </section>

    <section class="controls" aria-label="Controls">
      <div id="bet-controls" hidden>
        <div class="chips" role="group" aria-label="Add chips to your bet">
          <button class="chip" data-value="5" aria-label="Bet 5 dollars">5</button>
          <button class="chip" data-value="25" aria-label="Bet 25 dollars">25</button>
          <button class="chip" data-value="100" aria-label="Bet 100 dollars">100</button>
          <button class="chip" data-value="500" aria-label="Bet 500 dollars">500</button>
        </div>
        <div class="actions">
          <button id="btn-clear" class="btn secondary">Clear bet</button>
          <button id="btn-deal" class="btn primary">Deal</button>
          <button id="btn-reset" class="btn primary" hidden>New game</button>
        </div>
      </div>

      <div id="play-controls" class="actions" hidden>
        <button id="btn-hit" class="btn primary"><u>H</u>it</button>
        <button id="btn-stand" class="btn primary"><u>S</u>tand</button>
        <button id="btn-double" class="btn secondary"><u>D</u>ouble</button>
      </div>

      <button id="btn-retry" class="btn primary retry" hidden>Retry</button>
    </section>
    </div>

    <section id="panel-profile" class="panel profile" role="tabpanel" aria-labelledby="tab-profile" hidden>
      <form id="profile-form" class="profile-card" novalidate>
        <div class="profile-head">
          <img id="profile-avatar" class="avatar large" width="72" height="72" alt="" referrerpolicy="no-referrer" hidden>
          <div>
            <h2 id="profile-heading">Your profile</h2>
            <p id="profile-intro" class="muted"></p>
            <p id="profile-since" class="muted small"></p>
          </div>
        </div>

        <p id="profile-loading" class="muted">Loading your profile…</p>

        <div id="profile-fields" hidden>
          <label class="field">
            <span>Display name</span>
            <input id="pf-display-name" name="display_name" autocomplete="name" required aria-describedby="pf-display-name-error">
            <small id="pf-display-name-error" class="field-error" hidden></small>
          </label>

          <label class="field">
            <span>Username</span>
            <div class="input-prefix"><span aria-hidden="true">@</span>
              <input id="pf-username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required
                     pattern="[a-z0-9_]{3,20}" aria-describedby="pf-username-hint pf-username-error">
            </div>
            <small id="pf-username-hint" class="muted small">3–20 lowercase letters, numbers or underscores. Must be unique.</small>
            <small id="pf-username-error" class="field-error" hidden></small>
          </label>

          <label class="field">
            <span>Bio <em class="muted">(optional)</em></span>
            <textarea id="pf-bio" name="bio" rows="3" placeholder="High roller, card counter, or just here for fun?" aria-describedby="pf-bio-count pf-bio-error"></textarea>
            <small id="pf-bio-count" class="muted small counter"></small>
            <small id="pf-bio-error" class="field-error" hidden></small>
          </label>

          <div class="profile-actions">
            <button id="btn-profile-save" class="btn primary" type="submit">Save</button>
            <p id="profile-status" class="profile-status" role="status" aria-live="polite"></p>
          </div>
        </div>
      </form>
    </section>

    <footer class="footer">
      <span id="shoe"></span>
      <span>Cards by <a href="https://deckofcardsapi.com/" target="_blank" rel="noopener">Deck of Cards API</a></span>
    </footer>
  </main>
</body>
</html>
