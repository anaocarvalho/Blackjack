# Static site — no build step. Netlify serves the public/ folder as-is.
[build]
  publish = "public"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https://deckofcardsapi.com https://*.googleusercontent.com data:; connect-src https://deckofcardsapi.com https://dxdgffmczouqwjhwefkf.supabase.co; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
